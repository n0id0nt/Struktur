<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16/9;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        /* Loading overlay */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease-out;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            color: #fff;
            margin-top: 20px;
            font-size: 18px;
        }

        #loading-subtext {
            color: #888;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">Loading Game...</div>
            <div id="loading-subtext">This may take a moment</div>
        </div>
    </div>

    <script type='text/javascript'>
        var Module = {
            preRun: [],
            postRun: [],
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            
            // Called when Emscripten finishes loading
            setStatus: function(text) {
                if (text) {
                    console.log('Emscripten status:', text);
                    document.getElementById('loading-text').textContent = text;
                }
            },
            
            // This is called when the game is actually ready
            onRuntimeInitialized: function() {
                console.log('Runtime initialized');
                // Wait a bit for first frame to render, then hide loading
                setTimeout(function() {
                    var overlay = document.getElementById('loading-overlay');
                    overlay.classList.add('hidden');
                    setTimeout(function() {
                        overlay.style.display = 'none';
                    }, 500);
                }, 1000);
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
