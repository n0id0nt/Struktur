<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Struktur</title>
    
    <!-- Favicon (prevents 404 errors) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" href="data:," style="display:none">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Clean header */
        .header {
            background: #111111;
            border-bottom: 1px solid #333333;
            padding: 16px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.05em;
        }

        /* Game area */
        .game-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 24px;
        }

        canvas.emscripten {
            border: 1px solid #333333;
            background: #000000;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Loading overlay */
        .loading-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.9);
            padding: 32px;
            border: 1px solid #333333;
        }

        .loading-text {
            font-size: 14px;
            font-weight: 500;
            color: #cccccc;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }

        .progress-container {
            width: 240px;
            height: 2px;
            background: #333333;
            margin: 0 auto;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #ffffff;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Clean footer */
        .footer {
            background: #111111;
            border-top: 1px solid #333333;
            padding: 16px 24px;
            text-align: center;
        }

        .frame-button {
            background: #1a1a1a;
            border: 1px solid #444444;
            color: #e5e5e5;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .frame-button:hover {
            background: #2a2a2a;
            border-color: #666666;
        }

        /* Frameless mode */
        body.fullscreen-mode {
            overflow: hidden;
        }

        body.fullscreen-mode .header,
        body.fullscreen-mode .footer {
            display: none;
        }

        body.fullscreen-mode .game-area {
            padding: 0;
        }

        body.fullscreen-mode canvas.emscripten {
            border: none;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
        }

        /* Exit button */
        .fullscreen-exit-button {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 999999;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #444444;
            color: #e5e5e5;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            display: none;
            transition: all 0.2s ease;
        }

        .fullscreen-exit-button:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: #666666;
        }

        body.fullscreen-mode .fullscreen-exit-button {
            display: block;
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            padding: 16px;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            margin: 16px 0;
            font-size: 14px;
            font-weight: 500;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.3rem;
            }
            
            .header, .footer {
                padding: 12px 16px;
            }
            
            .game-area {
                padding: 16px;
            }
            
            .progress-container {
                width: 200px;
            }
            
            .frame-button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* Hide elements during loading */
        .footer {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .footer.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Clean header -->
    <div class="header">
        <h1>STRUKTUR</h1>
    </div>
    
    <!-- Main game area -->
    <div class="game-area">
        <div class="loading-container" id="loading">
            <div class="loading-text" id="status">Loading...</div>
            <div class="progress-container">
                <div class="progress-fill" id="progress"></div>
            </div>
        </div>
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    
    <!-- Clean footer -->
    <div class="footer" id="footer">
        <button class="frame-button" onclick="toggleFrame()" type="button" id="frame-btn">
            Remove Frame
        </button>
    </div>
    
    <!-- Exit button -->
    <button class="fullscreen-exit-button" onclick="addFrame()" type="button" id="exit-frame-btn">
        Add Frame
    </button>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var loadingElement = document.getElementById('loading');
        var canvasElement = document.getElementById('canvas');
        var footerElement = document.getElementById('footer');
        var frameBtn = document.getElementById('frame-btn');
        var exitFrameBtn = document.getElementById('exit-frame-btn');
        
        var isFrameless = false;

        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: canvasElement,
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                
                statusElement.innerHTML = text;
                
                if (m) {
                    var progress = parseInt(m[2]) / parseInt(m[4]) * 100;
                    progressElement.style.width = progress + '%';
                }
                
                if (text === '') {
                    loadingElement.style.display = 'none';
                    footerElement.classList.add('loaded');
                    
                    // Focus canvas for input
                    setTimeout(() => {
                        canvasElement.focus();
                    }, 500);
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
            }
        };
        
        Module.setStatus('Loading...');
        
        window.onerror = function() {
            Module.setStatus('');
            loadingElement.innerHTML = '<div class="error-message">Loading failed - please refresh</div>';
        };

        function toggleFrame() {
            console.log('Toggle frame called');
            
            if (isFrameless) {
                addFrame();
            } else {
                removeFrame();
            }
        }

        function removeFrame() {
            console.log('Removing frame');
            
            // Check if the C++ function is available
            if (typeof Module !== 'undefined' && Module._RequestFullscreenFromC) {
                console.log('Calling C++ RequestFullscreenFromC');
                Module._RequestFullscreenFromC();
            } else if (typeof RequestFullscreenFromC !== 'undefined') {
                console.log('Calling direct RequestFullscreenFromC');
                RequestFullscreenFromC();
            } else {
                console.log('C++ fullscreen function not available, using fallback');
                createFramelessMode();
            }
        }

        function addFrame() {
            console.log('Adding frame back');
            
            if (typeof Module !== 'undefined' && Module._ExitFullscreenFromC) {
                console.log('Calling C++ ExitFullscreenFromC');
                Module._ExitFullscreenFromC();
            } else if (typeof ExitFullscreenFromC !== 'undefined') {
                console.log('Calling direct ExitFullscreenFromC');
                ExitFullscreenFromC();
            } else {
                console.log('Exiting frameless mode');
                exitFramelessMode();
            }
        }

        function createFramelessMode() {
            console.log('Creating frameless mode');
            document.body.classList.add('fullscreen-mode');
            isFrameless = true;
            updateFrameButton();
            canvasElement.focus();
        }

        function exitFramelessMode() {
            console.log('Exiting frameless mode');
            document.body.classList.remove('fullscreen-mode');
            isFrameless = false;
            updateFrameButton();
        }

        function updateFrameButton() {
            if (isFrameless) {
                frameBtn.innerHTML = 'Add Frame';
            } else {
                frameBtn.innerHTML = 'Remove Frame';
            }
        }

        // Handle fullscreen change events (from C++ or browser)
        function handleFullscreenChange() {
            const isFullscreen = document.fullscreenElement || 
                                document.webkitFullscreenElement || 
                                document.mozFullScreenElement || 
                                document.msFullscreenElement;
            
            console.log('Fullscreen change detected. Is fullscreen:', !!isFullscreen);
            
            if (isFullscreen) {
                document.body.classList.add('fullscreen-mode');
                isFrameless = true;
            } else {
                document.body.classList.remove('fullscreen-mode');
                isFrameless = false;
            }
            
            updateFrameButton();
        }

        // Listen for fullscreen change events
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        // ESC key handling
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isFrameless) {
                addFrame();
            }
        });

        // Auto-focus canvas for keyboard input
        canvasElement.addEventListener('click', function() {
            canvasElement.focus();
        });

        // Initialize after game loads
        Module.postRun.push(function() {
            console.log('Game loaded, checking for C++ frame functions...');
            console.log('RequestFullscreenFromC available:', typeof RequestFullscreenFromC);
            console.log('Module._RequestFullscreenFromC available:', typeof Module._RequestFullscreenFromC);
        });
    </script>
    {{{ SCRIPT }}}
</body>
</html>
